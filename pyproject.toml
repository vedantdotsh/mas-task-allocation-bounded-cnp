[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-sim"
version = "0.1.0"
description = "Reproducible heterogeneous multi-agent task allocation experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "tiktoken>=0.12", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
